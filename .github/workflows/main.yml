name: CI/CD Frontend CarePlus

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch para executar o workflow'
        required: true
        default: 'main'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: ci-cd

    steps:
      # 1. Checkout do repositório do frontend
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 3. Instalar dependências e fazer build
      - name: Instalar Dependências e Fazer Build
        run: |
          npm install
          npm run build --if-present
        working-directory: ./careplus

      # 4. Enviar build (dist/) direto para a EC2 via rsync
      - name: Copiar dist/ para EC2 Frontend
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.FRONTEND_HOST }}
          REMOTE_USER: ubuntu
          TARGET: /var/www/careplus/
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "careplus/dist/"

      # 5. Ajustar permissões e recarregar Nginx
      - name: Recarregar Nginx na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            chown -R www-data:www-data /var/www/careplus
            chmod -R 755 /var/www/careplus

            nginx -t && systemctl reload nginx

            if systemctl is-active --quiet nginx; then
              echo "✓ Frontend CarePlus disponível"
            else
              echo "✗ ERRO: Nginx não está ativo"
              systemctl status nginx
              exit 1
            fi
